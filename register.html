
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | WhatsApp Sender</title>
  <link rel="stylesheet" href="register.css" />
</head>
<body>
  <div class="container">
    <h2>Register Your Company</h2>

    <input type="text" id="name" placeholder="Company Name" required />
    <input type="email" id="email" placeholder="Email Address" required />
    <input type="tel" id="phone" placeholder="Phone Number" required />
    <input type="password" id="password" placeholder="Password (minimum 8 characters)" required />

    <button id="registerButton" onclick="register()">Register</button>

    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:3000";

    async function register() {
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const password = document.getElementById("password").value;
      const button = document.getElementById("registerButton");

      if (!name || !email || !phone || !password) {
        alert("Please fill in all fields.");
        return;
      }

      if (password.length < 8) {
        alert("Your password must be at least 8 characters long.");
        return;
      }

      button.disabled = true;
      button.textContent = "Registering...";

      try {
        const response = await fetch(`${API_URL}/register`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({
            name,
            email,
            phone,
            password
          })
        });

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
          alert(data.error || data.message || `Registration failed (HTTP ${response.status}).`);
          return;
        }

        alert(data.message || "Registration successful!");
        window.location.href = "login.html";

      } catch (error) {
        console.error("Registration error:", error);
        alert(
          "Could not connect to the backend. Check that the backend is running at " +
          API_URL + " and inspect the browser Console (F12) for details."
        );
      } finally {
        button.disabled = false;
        button.textContent = "Register";
      }
    }
  </script>
</body>
</html>
